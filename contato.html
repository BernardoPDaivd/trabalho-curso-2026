<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formaluario de Contato</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <div>
            <div class="cabecalho">
                <h4 class="menu">
                    <img src="icon-ronphi.png" class="icon-ronphi">
                    <p>Portfólio de Bernardo C.C.P.David.</p>
                </h4>
            </div>
        </div>
    </header>
    <hr>
    <br>
    <form action="" method="post">
        <h3>Envie sua mensagem</h3>
        <label for="name">Nome:</label>
        <input type="text" class="name" placeholder="Digite seu nome">
        <label for="email">Email:</label>
        <input type="text" class="email" placeholder="Digite seu Email">
        <label for="assunto">Assunto</label>
        <input type="text" class="assunto" placeholder="Digite o assunto">
        <label for="mensagem">Mensagem</label>
        <textarea class="mensagem" rows="20" cols="70" placeholder="Digite sua mensagem"></textarea>
        <button type="submit">Enviar mensagem</button>
    </form>
    <hr>
    <a href="index.html" class="voltar"><button>Voltar</button></a>
</body>
</html>
